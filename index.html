<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Catalogo publico da Bemavi Pao Artesanal para pedidos por WhatsApp.">
  <title>Bemavi | Catalogo de Pedidos</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700&family=Playfair+Display:wght@600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="./assets/css/catalogo-publico.css">
</head>
<body>
  <header class="public-header">
    <div class="brand">
      <img src="https://cdn-icons-png.flaticon.com/512/992/992747.png" alt="" class="brand-icon">
      <div>
        <strong>Bemavi</strong>
        <span>Pao artesanal sob encomenda</span>
      </div>
    </div>
    <a class="whatsapp-link" href="https://wa.me/5527992760190" target="_blank" rel="noopener">WhatsApp</a>
  </header>

  <main class="public-shell">
    <section class="hero">
      <div class="hero-copy">
        <h1>Catalogo Bemavi</h1>
        <p>Escolha seus paes, revise o carrinho e envie o pedido direto pelo WhatsApp.</p>
      </div>
    </section>

    <section class="content-grid">
      <div class="catalog-panel">
        <div class="section-heading">
          <h2>Paes disponiveis</h2>
          <span id="catalogCount">Carregando...</span>
        </div>
        <div id="publicCatalogGrid" class="product-grid">
          <div class="loading-card">Buscando catalogo...</div>
        </div>
      </div>

      <aside class="checkout-panel" aria-label="Resumo do pedido">
        <div class="checkout-sticky">
          <div class="section-heading">
            <h2>Seu pedido</h2>
            <span id="cartCount">0 itens</span>
          </div>

          <div id="publicCartItems" class="cart-list">
            <div class="empty-cart">Seu carrinho esta vazio.</div>
          </div>

          <div class="cart-total">
            <span>Total estimado</span>
            <strong id="publicCartTotal">R$ 0,00</strong>
          </div>

          <form id="publicOrderForm" class="public-form">
            <div class="field-group">
              <label for="public_nome">Nome *</label>
              <input id="public_nome" type="text" autocomplete="name" required placeholder="Seu nome completo">
            </div>

            <div class="field-group">
              <label for="public_telefone">WhatsApp *</label>
              <input id="public_telefone" type="tel" autocomplete="tel" required placeholder="(27) 99999-9999">
            </div>

            <div class="field-row">
              <div class="field-group">
                <label for="public_entrega">Entrega/retirada *</label>
                <select id="public_entrega" required>
                  <option value="Entrega">Entrega</option>
                  <option value="Retirada">Retirada</option>
                </select>
              </div>
              <div class="field-group">
                <label for="public_data">Data desejada *</label>
                <input id="public_data" type="date" required>
              </div>
            </div>

            <div class="field-group">
              <label for="public_municipio">Municipio *</label>
              <select id="public_municipio" required>
                <option value="Vitória">Vitoria</option>
                <option value="Vila Velha">Vila Velha</option>
                <option value="Serra">Serra</option>
              </select>
            </div>

            <div id="addressFields">
              <div class="field-group">
                <label for="public_endereco">Endereco *</label>
                <input id="public_endereco" type="text" autocomplete="street-address" required placeholder="Rua, numero, bairro, cidade">
              </div>
            </div>

            <div class="field-group">
              <label for="public_pagamento">Pagamento *</label>
              <select id="public_pagamento" required>
                <option value="PIX ou dinheiro na entrega/retirada">PIX ou dinheiro na entrega/retirada</option>
                <option value="Quero pagar online por PIX Abacate Pay">Quero pagar online por PIX Abacate Pay</option>
                <option value="Quero pagar online por cartao de credito Abacate Pay">Quero pagar online por cartao de credito Abacate Pay</option>
              </select>
            </div>

            <div class="field-group">
              <label for="public_obs">Observacoes</label>
              <textarea id="public_obs" rows="3" placeholder="Ex: pao fatiado, horario preferido, referencia"></textarea>
            </div>

            <button type="submit" class="submit-order">Enviar pedido pelo WhatsApp</button>
          </form>

          <div id="abacateCheckout" class="abacate-checkout" hidden></div>
        </div>
      </aside>
    </section>
  </main>

  <div id="publicToast" class="public-toast" role="status" aria-live="polite"></div>
  <script src="./assets/js/catalogo-publico.js"></script>
</body>
</html>
